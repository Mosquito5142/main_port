<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ออฟไลน์ — GreenPort</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    text-align: center;
    padding: 24px;
    background: linear-gradient(180deg, #f6fbf6 0%, #e8f5e9 100%);
    color: #1b5e20;
  }
  .emoji { font-size: 56px; }
  h1 { font-size: 20px; margin: 0; }
  p { font-size: 14px; color: rgba(27, 94, 32, 0.7); max-width: 380px; margin: 0; }
  button {
    margin-top: 8px;
    padding: 10px 20px;
    border: none;
    border-radius: 12px;
    background-image: linear-gradient(135deg, #66bb6a 0%, #1b5e20 100%);
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="emoji">🍃📴</div>
  <h1>ตอนนี้ไม่มีอินเทอร์เน็ต</h1>
  <p>หน้านี้ยังไม่เคยถูกโหลดไว้ตอนออนไลน์ ลองเชื่อมต่อใหม่แล้วกดปุ่มด้านล่าง — หน้าที่เคยเปิดไว้ก่อนหน้านี้ยังดูได้ตามปกติ</p>
  <button onclick="location.reload()">ลองใหม่อีกครั้ง</button>
</body>
</html>
